params:
  H0:
    prior:
      min: 60
      max: 80
    proposal: 0.5
    latex: H_0
  omega_b:
    prior:
      min: 0.015
      max: 0.03
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.1
      max: 0.14
    proposal: 0.001
    latex: \Omega_\mathrm{c} h^2
    renames:
    - omegach2
  logA:
    prior:
      min: 2
      max: 4
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
    renames:
    - As
  n_s:
    prior:
      min: 0.88
      max: 1.06
    proposal: 0.002
    latex: n_\mathrm{s}
    renames:
    - ns
  tau_reio:
    prior:
      min: 0.01
      max: 0.15
    proposal: 0.003
    latex: \tau_\mathrm{reio}
    renames:
    - tau
  omegak:
    prior:
      min: -0.03
      max: 0.03
    proposal: 0.001
    renames:
    - Omega_k
  Omega_m:
    latex: \Omega_\mathrm{m}
    derived: true
    renames:
    - omegam
  Omega_k_1000:
    derived: 'lambda omegak: 1000 * omegak'
    latex: 10^{3}\,\Omega_\mathrm{k}
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_\mathrm{cal}
    renames: calPlanck
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 100
    max_tries: 100
    covmat: null
    covmat_params: null
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - H0
        - omega_b
        - omega_cdm
        - logA
        - n_s
        - tau_reio
        - omegak
    - - 10
      - - A_planck
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.6.2
